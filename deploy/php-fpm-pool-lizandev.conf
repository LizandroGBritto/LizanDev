; /etc/php/8.3/fpm/pool.d/lizandev.conf
; Pool propio con un usuario sin privilegios: si el sitio se compromete,
; no alcanza a los demás proyectos del servidor.
[lizandev]
user = lizandev
group = lizandev
listen = /run/php/php8.3-fpm-lizandev.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s

; Aísla el sitio en su carpeta y apaga lo que un portafolio no usa.
php_admin_value[open_basedir] = /var/www/dev.lizan.site:/tmp:/usr/share/php:/etc/ssl/certs:/dev/urandom
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 3M
