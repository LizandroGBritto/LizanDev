# /etc/nginx/sites-available/dev.lizan.site  (enlazar en sites-enabled)
# El certificado se emite antes con certbot (--webroot) y luego se instala este archivo.

server {
    listen 80;
    listen [::]:80;
    server_name dev.lizan.site;

    # Solo la validación de Let's Encrypt queda en HTTP; el resto pasa a HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/dev.lizan.site/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.lizan.site;

    ssl_certificate     /etc/letsencrypt/live/dev.lizan.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lizan.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # La raíz es SOLO public/. .env, vendor/, storage/, database/ y el código
    # quedan un nivel más arriba y nginx no tiene forma de servirlos.
    root /var/www/dev.lizan.site/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Cualquier archivo o carpeta oculta (.env, .git, .htaccess, .DS_Store…), salvo .well-known.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Extensiones que nunca deben salir aunque alguien las deje en public/.
    location ~* \.(env|sqlite|sqlite3|db|sql|bak|backup|old|orig|swp|log|ini|conf|lock|md|yml|yaml|json|xml|sh|git)$ {
        # build/manifest.json lo lee PHP desde disco, no hace falta servirlo.
        deny all;
        return 404;
    }

    # El manifiesto lo lee PHP desde disco; no hace falta que sea público.
    location = /build/manifest.json { return 404; }

    # Los assets compilados llevan hash en el nombre: cache larga y sin tocar PHP.
    location ^~ /build/ { access_log off; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ^~ /assets/ { access_log off; expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    location = /robots.txt { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Único PHP ejecutable: el front controller. Cualquier otro .php devuelve 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-lizandev.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    access_log /var/log/nginx/dev.lizan.site.access.log;
    error_log  /var/log/nginx/dev.lizan.site.error.log;
}
